-- Sample GQL for the SdlcGraph property graph (Spanner Graph). Run with execute_sql.

-- 1. Contracts and what they depend on.
GRAPH SdlcGraph
MATCH (c:Node {kind: 'contract'})-[:Rel {rel: 'depends_on'}]->(d:Node)
RETURN c.slug AS contract, c.state AS contract_state, d.slug AS depends_on, d.kind AS dep_kind
ORDER BY contract, depends_on;

-- 2. Epic -> anything it decomposes into, one to three hops.
GRAPH SdlcGraph
MATCH (e:Node {kind: 'epic'})-[:Rel {rel: 'decomposes_into'}]->{1,3}(n:Node)
RETURN DISTINCT e.slug AS epic, n.kind AS kind, n.slug AS slug;

-- 3. Code graph: what does a function call, in one snapshot.
GRAPH SdlcGraph
MATCH (a:Symbol {kind: 'function'})-[:SymRel {rel: 'calls'}]->(b:Symbol)
WHERE a.snapshot_id = 1
RETURN a.qualname AS caller, b.qualname AS callee;

-- 4. Lifecycle: everything below a node over decomposes_into and promoted_to, one to six hops. {slug} is replaced by
-- a GQL string literal ('epic-rate-limits') by `sdlc-graph spanner query lifecycle_tree --slug ...`. The Postgres twin
-- is sdlc_graph.ledger.lifecycle.tree.
GRAPH SdlcGraph
MATCH (r:Node {slug: {slug}})-[e:Rel WHERE e.rel IN ('decomposes_into', 'promoted_to')]->{1,6}(n:Node)
RETURN DISTINCT n.slug AS slug, n.kind AS kind, n.state AS state
ORDER BY slug;
