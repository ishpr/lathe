schema_version: "1.1"
name: agent-ready-headless-owner-missing
expected_outcome: |
  The input names no owner and nobody can answer. The skill prints a line starting
  "ESCALATION: decision owner unknown", still writes docs/stories/export-csv.md, gives the story the line
  "**Decision owner:** unknown, blocked" and "**Ready:** blocked on owner" (plus the open decision numbers when
  decisions are also open), and does not invent an owner. lint_epic.py --agent reports no error about the owner
  (assumed decisions are the only errors it may report).
---
tags: [skill-creator]
max_turns: 25
timeout_seconds: 900
allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash, Agent]
