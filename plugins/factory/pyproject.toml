[project]
name = "sdlc-graph"
version = "1.0.6"
description = "Derived code graph, intent ledger and impact-ordered verification for a graph-native SDLC"
authors = [{ name = "Ish Prasad" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "mcp>=1.2,<2",
    "google-cloud-spanner",
    "pyjwt[crypto]>=2.8",
]

[project.scripts]
sdlc-graph = "sdlc_graph.cli:main"

[dependency-groups]
dev = ["pytest>=8", "fastapi==0.115.6", "uvicorn==0.54.0", "sqlalchemy==2.0.36", "httpx==0.28.1", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdlc_graph"]

[tool.hatch.build.targets.wheel.force-include]
"sql" = "sdlc_graph/_sql"

[tool.pytest.ini_options]
testpaths = ["tests/graph"]  # tests/sdlc runs with plain pytest (standard library), tests/epic with check_examples.sh
addopts = "-ra"
norecursedirs = ["_fixtures", ".*", "node_modules", "__pycache__"]  # eval fixtures are other repos' tests, not ours
markers = [
    "db: needs the Postgres service (skipped when it is unreachable)",
    "spanner: needs the Spanner emulator (skipped when SPANNER_EMULATOR_HOST is unreachable)",
    "slow: indexes the sample app or a SAMPLE_REPO checkout",
]
