name: oidc-smoke

# Checks ledger/oidc.py against a REAL GitHub Actions OIDC token, which no unit test can mint: a token GitHub
# signed is accepted only from the trusted workflow ref, only for the node's exact owner/name, only with the
# right audience; a ci: row without a token and a node with a bare repo name are refused.
#
# Installing the plugin from this checkout is fine HERE and nowhere else: this is the plugin's own repository,
# the workflow has no pull_request trigger (it runs on pushes to main and on a manual dispatch by someone with
# write access), it holds no ledger secret, and its database is a throwaway service container. A customer's
# templates must never install or run code from the pull request's checkout: the PR author controls it.
#
# SDLC_OIDC_EVENTS is widened to workflow_dispatch,push in this job only, because this job is not a
# workflow_run job. A customer ledger must never widen it: the default (workflow_run) is what keeps a pull
# request's own workflows from producing binding evidence. Every `uses:` is pinned to a commit SHA.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - plugins/factory/sdlc_graph/ledger/oidc.py
      - plugins/factory/sdlc_graph/ledger/evidence.py
      - plugins/factory/templates/ci/sdlc-evidence.yml
      - .github/workflows/oidc-smoke.yml

permissions:
  contents: read

concurrency:
  group: oidc-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sdlc
          POSTGRES_USER: sdlc
          POSTGRES_PASSWORD: sdlc
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U sdlc -d sdlc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://sdlc:sdlc@localhost:5435/sdlc
      REPO: ${{ github.repository }}
      TRUSTED_REF: ${{ github.repository }}/.github/workflows/oidc-smoke.yml@${{ github.ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv and the plugin (from this checkout; see the note at the top)
        run: |
          python -m pip install --upgrade pip uv
          uv venv --python 3.11 plugins/factory/.venv
          uv sync --project plugins/factory

      - name: Initialise the database and create the nodes
        run: |
          sg=plugins/factory/.venv/bin/sdlc-graph
          $sg db init --json > /dev/null
          $sg node draft --slug oidc-smoke --title "OIDC smoke" --repo "$REPO" --actor @smoke \
            --ticket "Smoke test of the OIDC verification." --json > /dev/null
          $sg node draft --slug oidc-smoke-bare --title "OIDC smoke, bare repo" --repo "${REPO#*/}" --actor @smoke \
            --ticket "Smoke test of the bare repo refusal." --json > /dev/null

      - name: Request real OIDC tokens (audience sdlc-graph, and a wrong one)
        run: |
          for aud in sdlc-graph not-sdlc-graph; do
            jwt="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$aud" | python3 -I -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            echo "::add-mask::$jwt"
            printf '%s' "$jwt" > "$RUNNER_TEMP/$aud.jwt"
          done

      - name: Assert what the ledger accepts and refuses
        run: |
          sg="$PWD/plugins/factory/.venv/bin/sdlc-graph"
          payload="$(python3 -I -c 'import json,os; print(json.dumps({"url": os.environ["RUN_URL"], "conclusion": "success", "green": True, "run_id": int(os.environ["GITHUB_RUN_ID"])}))')"
          ok="$RUNNER_TEMP/sdlc-graph.jwt"; wrong_aud="$RUNNER_TEMP/not-sdlc-graph.jwt"
          fails=0
          # expect <exit code> <label> <env assignments...> -- <sdlc-graph args...>
          expect() {
            local want="$1" label="$2"; shift 2
            local envs=(); while [ "$1" != "--" ]; do envs+=("$1"); shift; done; shift
            local rc=0
            env "${envs[@]}" "$sg" "$@" --json > "$RUNNER_TEMP/out.json" 2>&1 || rc=$?
            if [ "$rc" = "$want" ]; then echo "ok    $label (exit $rc)"
            else echo "::error::$label: expected exit $want, got $rc"; cat "$RUNNER_TEMP/out.json"; fails=1; fi
          }
          add=(evidence add oidc-smoke --kind ci_run --payload "$payload" --source "ci:$RUN_URL")
          good=("SDLC_OIDC_WORKFLOW_REF=$TRUSTED_REF" "SDLC_OIDC_EVENTS=workflow_dispatch,push")

          # (a) the trusted ref, the right audience: accepted, binding, signed by the token's verified sub
          expect 0 "real token from the trusted workflow is accepted" "${good[@]}" -- "${add[@]}" --oidc-token "@$ok"
          python3 -I - "$RUNNER_TEMP/out.json" "$ok" <<'EOF' || fails=1
          import base64, json, sys
          row = json.load(open(sys.argv[1]))
          part = open(sys.argv[2]).read().strip().split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4)))
          assert row["binding"] is True, row
          assert row["signed_by"] == claims["sub"], (row["signed_by"], claims["sub"])
          assert row["payload"]["oidc"]["job_workflow_ref"] == claims["job_workflow_ref"], row["payload"]["oidc"]
          assert row["payload"]["evidence_run_id"] == str(claims["run_id"]), row["payload"]
          print("ok    the row is binding, signed_by is the verified sub:", claims["sub"])
          EOF
          # (b) a wrong trusted ref: refused
          expect 2 "a wrong SDLC_OIDC_WORKFLOW_REF is refused" "SDLC_OIDC_WORKFLOW_REF=$REPO/.github/workflows/other.yml@refs/heads/main" \
            "SDLC_OIDC_EVENTS=workflow_dispatch,push" -- "${add[@]}" --oidc-token "@$ok"
          # unset trusted ref, and the default event list (workflow_run only): refused
          expect 2 "an unset SDLC_OIDC_WORKFLOW_REF is refused" "SDLC_OIDC_WORKFLOW_REF=" "SDLC_OIDC_EVENTS=workflow_dispatch,push" -- "${add[@]}" --oidc-token "@$ok"
          expect 2 "a $GITHUB_EVENT_NAME token is refused under the default events" "SDLC_OIDC_WORKFLOW_REF=$TRUSTED_REF" "SDLC_OIDC_EVENTS=" -- "${add[@]}" --oidc-token "@$ok"
          # (c) a wrong audience: refused
          expect 2 "a token for another audience is refused" "${good[@]}" -- "${add[@]}" --oidc-token "@$wrong_aud"
          # (d) a ci: row with no token: refused
          expect 2 "a ci: row without a token is refused" "${good[@]}" -- "${add[@]}"
          # (e) a node with a bare repo name: refused
          expect 2 "a node with a bare repo is refused" "${good[@]}" -- evidence add oidc-smoke-bare --kind ci_run \
            --payload "$payload" --source "ci:$RUN_URL" --oidc-token "@$ok"
          # nothing but (a) was stored
          env "${good[@]}" "$sg" node get oidc-smoke --json > "$RUNNER_TEMP/node.json"
          python3 -I -c 'import json,sys; s=json.load(open(sys.argv[1]))["evidence"]["ci_run"]; assert s["count"] == 1 and s["binding"], s; print("ok    exactly one ci_run row, binding")' "$RUNNER_TEMP/node.json" || fails=1
          exit $fails
