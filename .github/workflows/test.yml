name: test

# Validates the marketplace and the four plugins with the real Claude Code CLI, runs the sdlc and
# graph suites, the end-to-end harness and the demo on examples/sample-app.
# Every `uses:` is pinned to a commit SHA. `claude plugin validate --strict` fails on a bad manifest,
# an unreadable component, a reserved name, or a warning such as a marketplace entry whose version
# differs from the plugin's plugin.json.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DATABASE_URL: postgresql://sdlc:sdlc@localhost:5435/sdlc

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the marketplace and the four plugins
        run: |
          claude plugin validate . --strict
          claude plugin validate plugins/sdlc --strict
          claude plugin validate plugins/graph --strict
          claude plugin validate plugins/epic-writer --strict
          claude plugin validate plugins/factory --strict

      - name: Epic-writer examples lint clean
        run: bash plugins/epic-writer/skills/epic-writer/scripts/check_examples.sh

  sdlc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install test tools and the sample app's dependencies (the e2e harness runs its tests)
        run: python -m pip install --upgrade pip pytest ruff mypy fastapi==0.115.6 uvicorn==0.34.0 sqlalchemy==2.0.36 httpx==0.28.1

      - name: sdlc tests
        run: python3 -m pytest plugins/sdlc/tests -q

      - name: End-to-end harness on examples/sample-app
        run: bash plugins/sdlc/tests/e2e/run_harness.sh

  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sdlc
          POSTGRES_USER: sdlc
          POSTGRES_PASSWORD: sdlc
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U sdlc -d sdlc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: plugins/graph
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv and the plugin
        run: |
          python -m pip install --upgrade pip uv
          uv venv --python 3.11 .venv
          uv sync

      - name: Initialise the database
        run: .venv/bin/sdlc-graph db init

      - name: graph tests
        run: .venv/bin/python -m pytest -q

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sdlc
          POSTGRES_USER: sdlc
          POSTGRES_PASSWORD: sdlc
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U sdlc -d sdlc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv and the graph plugin
        run: |
          python -m pip install --upgrade pip uv
          cd plugins/graph
          uv venv --python 3.11 .venv
          uv sync

      - name: Demo on examples/sample-app
        env:
          DEMO_SKIP_SPANNER: "1"
        run: bash plugins/graph/demo/run_demo.sh
