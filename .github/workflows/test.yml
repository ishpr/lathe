name: test

# Validates the marketplace and the factory plugin with the real Claude Code CLI, runs the sdlc and
# graph suites, the end-to-end harness, the demo on examples/sample-app and the epic examples lint.
# Every `uses:` is pinned to a commit SHA. `claude plugin validate --strict` fails on a bad manifest,
# an unreadable component, a reserved name, or a warning such as a marketplace entry whose version
# differs from the plugin's plugin.json.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DATABASE_URL: postgresql://sdlc:sdlc@localhost:5435/sdlc

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the marketplace and the factory plugin
        run: |
          claude plugin validate . --strict
          claude plugin validate plugins/factory --strict

      - name: Required deny rules present, no blanket runner, every command a skill names allowed or denied
        run: python3 -I plugins/factory/scripts/check_skill_permissions.py --root plugins/factory

  sdlc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install test tools, uv and the sample app's dependencies (the e2e harness runs its tests)
        run: python -m pip install --upgrade pip pytest ruff mypy uv fastapi==0.115.6 uvicorn==0.34.0 sqlalchemy==2.0.36 httpx==0.28.1

      - name: sdlc tests
        run: python3 -m pytest plugins/factory/tests/sdlc -q

      - name: End-to-end harness on examples/sample-app
        run: bash plugins/factory/tests/e2e/run_harness.sh

  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sdlc
          POSTGRES_USER: sdlc
          POSTGRES_PASSWORD: sdlc
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U sdlc -d sdlc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install uv and the plugin
        run: |
          python -m pip install --upgrade pip uv
          uv venv --python 3.11 plugins/factory/.venv
          uv sync --project plugins/factory

      - name: Initialise the database
        run: uv run --project plugins/factory sdlc-graph db init

      - name: graph tests
        run: uv run --project plugins/factory python -m pytest plugins/factory/tests/graph -q

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sdlc
          POSTGRES_USER: sdlc
          POSTGRES_PASSWORD: sdlc
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U sdlc -d sdlc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install uv and the plugin
        run: |
          python -m pip install --upgrade pip uv
          uv venv --python 3.11 plugins/factory/.venv
          uv sync --project plugins/factory

      - name: Demo on examples/sample-app
        env:
          DEMO_SKIP_SPANNER: "1"
        run: bash plugins/factory/demo/run_demo.sh

  epic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Epic examples lint clean
        run: bash plugins/factory/tests/epic/check_examples.sh

      - name: Epic lint tests
        run: python3 -m pytest plugins/factory/tests/epic -q
